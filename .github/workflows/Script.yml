name: Ubuntu Root VPS
on: workflow_dispatch

jobs:
  vps:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Root SSH & Tunnel
        run: |
          # 1. Update and install OpenSSH Server
          sudo apt-get update && sudo apt-get install -y openssh-server

          # 2. Set ROOT password to 'root'
          echo "root:root" | sudo chpasswd

          # 3. Configure SSH to allow Root Login and Password Auth
          # This is the 'secret sauce' to make root access work
          sudo sed -i 's/^#PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          
          # Restart the service to apply changes
          sudo systemctl restart ssh

          # 4. Install cloudflared
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          # 5. Start Tunnel and WAIT for the link
          cloudflared tunnel --url ssh://localhost:22 --logfile tunnel.log > /dev/null 2>&1 &
          
          echo "Waiting for Cloudflare link..."
          sleep 10
          echo "=========================================="
          grep -o 'https://[^[:space:]]*\.trycloudflare\.com' tunnel.log || echo "Failed to find link."
          echo "=========================================="
          
          # 6. KEEP ALIVE (6 Hours)
          echo "Root VPS is live. Username: root | Password: root"
          sleep 21600
